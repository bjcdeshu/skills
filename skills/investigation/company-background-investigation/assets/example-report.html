.identity-control{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:var(--fs-sm);line-height:1.6;color:var(--text);font-variant-numeric:tabular-nums}
.identity-control strong{color:var(--accent);font-size:var(--fs-lead)}
.finding-body{min-width:0}
.finding-body h3{margin-bottom:6px;font-size:var(--fs-lead);font-weight:700}
.finding-body p{max-width:var(--measure);color:var(--text-2)}
.finding-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.finding-meta>.source-refs,.finding-meta>.entity-links,.finding-meta>.claim-link,.finding-meta>.grade-badges{margin-top:0}
/* Metric grid fallback for engines without :has() (same orphan-free rules) */
#businessMetrics[data-count="1"]>*{grid-column:span 12}
#businessMetrics[data-count="2"]>*{grid-column:span 6}
#businessMetrics[data-count="3"]>*,#businessMetrics[data-count="5"]>*,#businessMetrics[data-count="6"]>*{grid-column:span 4}
#businessMetrics[data-count="5"]>:nth-child(n+4){grid-column:span 6}
#businessMetrics[data-count="7"]>:nth-child(n+5){grid-column:span 4}
/* Co-occurrence subject switcher */
.cooccur-subjects{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cooccur-subject{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:var(--fs-sm);color:var(--text-2)}
.cooccur-subject[aria-pressed="false"]{opacity:1;border-style:solid;background:var(--surface)}
.cooccur-subject[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
/* Path cards & peek extras */
.path-card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.peek-actions{display:flex;gap:8px;margin-top:12px}
.peek-actions>*{flex:1;justify-content:center;min-height:34px;font-size:var(--fs-sm)}
.peek-actions .primary{margin-top:0}
.network-peek .peek-close{position:absolute;top:8px;right:8px;width:28px;height:28px}

/* ---------- 22. Responsive ---------- */
@media (min-width:1600px){
  :root{--content-max:1180px;--wide-max:1440px}
  body.drawer-open main{margin-right:var(--drawer-w)}
  body.drawer-open .drawer{box-shadow:none}
}
@media (min-width:1024px){
  .drawer-backdrop{display:none!important}
}
@media (max-width:1279px){
  .network-hint{display:none}
}
@media (max-width:1023px){
  :root{--rail:0px;--drawer-w:min(560px,88vw)}
  .sidebar{width:280px;max-width:86vw;transform:translateX(-102%);transition:transform .22s var(--ease);box-shadow:none;z-index:60}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-pop)}
  .menu-toggle{display:inline-flex;width:auto;padding:0 8px}
  .mobile-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 var(--fs-ui)/1.4 var(--font-head);color:var(--text)}
  .topbar-kind{display:none}
  .noscript{margin-left:0}
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .block-grid{grid-template-columns:minmax(0,1fr)}
  .block-grid .content-block{grid-column:auto}
  .network-search{max-width:none;flex-basis:100%;order:3;margin-left:0}
  .tool-actions{margin-left:auto}
  .business-metrics:has(>:nth-child(7))>*,#businessMetrics[data-count="7"]>*,#businessMetrics[data-count="8"]>*{grid-column:span 4}
  .business-metrics:has(>:nth-child(7):last-child)>:nth-child(n+7),#businessMetrics[data-count="7"]>:nth-child(n+7){grid-column:span 12}
  .business-metrics:has(>:nth-child(8):last-child)>:nth-child(n+7),#businessMetrics[data-count="8"]>:nth-child(n+7){grid-column:span 6}
}
@media (max-width:767px){
  :root{--page-pad:20px;--topbar-h:52px;--fs-h2:23px;--fs-fig:26px}
  body{font-size:15.5px}
  .section{padding:44px 0}
  .hero{padding-top:32px}
  .hero h1{font-size:30px}
  .hero-subtitle,.section-intro{font-size:var(--fs-body)}
  .verdict-quote,.judgment>.text,.judgment>p{font-size:17px;padding-left:18px}
  .judgment .grade-summary,.judgment .grade-badges,.judgment .source-refs{padding-left:21px}
  .judgment .claim-link{margin-left:21px}
  .verdict-text{font-size:17px;padding-left:18px}
  .verdict-evidence{padding-left:21px}
  .hero-grid{margin-top:32px;gap:24px}
  .business-metrics>*{grid-column:span 6!important;padding:16px 16px 18px}
  .business-metrics>:last-child:nth-child(odd){grid-column:span 12!important}
  .finding-row,.findings>.finding{grid-template-columns:40px minmax(0,1fr);column-gap:14px}
  .finding-row>.item-number,.finding-row>.finding-num,.finding-row>.finding-number,.findings>.finding>.item-number{font-size:22px}
  .section-head{flex-direction:column;align-items:flex-start;gap:8px}
  .section-head>p{text-align:left;max-width:none}
  .content-block{padding:20px}
  .palette-switch{margin-right:0}
  .palette-switch button{width:24px;height:24px}
  .topbar-actions{gap:0}
  .topbar-actions kbd,.hide-sm,.menu-label{display:none}
  .network-panel{margin-inline:calc(-1 * var(--page-pad) + 8px);border-radius:12px}
  .network-toolbar{padding:10px 12px;gap:8px}
  .toolbar-main{gap:6px}
  .seg button{padding:3px 9px}
  .tool-btn{padding:4px 9px}
  .network-legend{padding:8px 12px;gap:4px 12px}
  .network-viewport{height:70vh;height:70svh;min-height:300px}
  .network-peek{left:8px;right:8px;bottom:8px;width:auto;max-height:55%}
  .zoom-tools{right:8px;top:8px;bottom:auto}
  .network-path{padding:12px 14px}
  .network-footer{padding:9px 12px}
  .network-list-view li{grid-template-columns:minmax(0,1fr) auto}
  .network-list-view li>:nth-child(2){grid-column:1}
  .field-grid,.drawer-body .field-grid{grid-template-columns:minmax(0,1fr)}
  .claim-dates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-row{grid-template-columns:68px minmax(0,1fr) 56px;gap:8px}
  .timeline-item{grid-template-columns:76px minmax(0,1fr);column-gap:26px}
  .timeline-item::before{left:88px}
  .timeline-item::after{left:83px}
  .timeline-item>time{font-size:var(--fs-xs)}
  .table-scroll th:first-child,.table-scroll td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
  .table-scroll thead th:first-child{z-index:2;background:var(--surface-2)}
  .question summary{padding:15px 16px;gap:12px;font-size:var(--fs-body)}
  .question-body,.archive-body{padding:16px}
  .archive>summary{padding:16px;align-items:flex-start}
  .source-tools{gap:10px}
  .report-footer{padding-bottom:32px}
  /* Drawer becomes a modal bottom sheet */
  .drawer{top:auto;left:0;right:0;width:auto;height:92vh;height:92dvh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;animation:sheet-in .24s var(--ease)}
  .drawer::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-strong)}
  .drawer-nav{padding-top:14px}
  .drawer-title-row{padding:14px 20px 10px}
  #drawerTitle{font-size:21px}
  .drawer-tabs{padding:0 12px}
  .drawer-body{padding:16px 20px 40px}
  .drawer-actions .quiet{padding:5px 7px;font-size:var(--fs-xs)}
  dialog.site-search-dialog{width:calc(100vw - 16px);margin-top:24px}
  .site-search-result{grid-template-columns:52px minmax(0,1fr);gap:2px 10px}
  .lightbox-stage{inset:56px 8px 96px}
  .lightbox-nav{top:auto;bottom:24px;margin-top:0;width:42px;height:42px}
  .lightbox-caption{bottom:76px}
}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (max-width:420px){
  .palette-switch{display:none}
  #printReport{display:none}
}

/* ---------- 23. Motion & forced colors ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (forced-colors:active){
  .net-edge{stroke:CanvasText}
  .edge-group.active .net-edge,.edge-group.path-active .net-edge{stroke:Highlight}
  .net-node .node-shape{fill:Canvas;stroke:CanvasText}
  .net-node.active .node-shape{stroke:Highlight}
  .net-node .node-glyph,.net-node .node-label{fill:CanvasText;stroke:Canvas}
  .arrow,marker.arrow{fill:CanvasText}
  .grade-badge,.chip,.source-ref,.status{border:1px solid CanvasText}
  .report-nav a.active{outline:2px solid Highlight}
}

/* ---------- 24. A4 print ---------- */
@media print{
  @page{size:A4;margin:18mm 16mm 20mm}
  @page:first{margin-top:14mm}
  @page{@bottom-right{content:counter(page) " / " counter(pages);font-size:8pt;color:#6F675D}}
  :root:root:root{color-scheme:light;--bg:#FFFFFF;--surface:#FFFFFF;--canvas:#FFFFFF;--surface-2:#F5F3EF;--shadow-1:none;--shadow-pop:none;--scrim:transparent;--fs-body:10pt;--measure:none}
  html{scroll-behavior:auto;scroll-padding-top:0}
  body{background:#FFFFFF;color:var(--text);font-size:10pt;line-height:1.6;overflow:visible!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sidebar,.topbar,.skip,.hero-actions,.network-toolbar,.filter-banner,.pathfinder-bar,.zoom-tools,.canvas-toast,.network-peek,.network-minimap,.network-list-view,.network-hint,.source-tools,.drawer,.drawer-backdrop,.source-popover,dialog,.report-footer a,.claim-link,.inspect-action,.profile-action,.chart-data,.noscript{display:none!important}
  main{margin:0!important;padding:0;max-width:none}
  .section,.section.network-section,.report-footer{max-width:none;padding:16pt 0;border-bottom:.5pt solid var(--line)}
  .section-head{margin-bottom:12pt}
  .section-head h2{font-size:18pt}
  .section-head>p{font-size:8.5pt}
  .eyebrow{font-size:8pt}
  .section-intro{font-size:10.5pt;margin-bottom:12pt}
  p,li,dd{orphans:3;widows:3}
  h2,h3,h4,.section-head,summary{break-after:avoid;page-break-after:avoid}
  a{color:inherit;text-decoration:none}
  /* Cover page */
  .hero{padding-top:0;break-after:page;page-break-after:always;border-bottom:0}
  .hero h1{font-size:26pt;margin-top:10pt}
  .hero-subtitle{font-size:11pt}
  .hero-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16pt;margin-top:20pt}
  .verdict-quote,.judgment>.text,.judgment>p,.verdict-text{font-size:12pt;line-height:1.7}
  .identity-name{font-size:16pt}
  .identity-card[class*="t-"]{border-top-width:2pt}
  .identity-card,.hero-card{padding:12pt;box-shadow:none}
  .identity-card img,.hero-media img{max-height:45mm}
  .business-metrics{margin-top:20pt}
  .business-metrics>*{padding:10pt 12pt}
  .business-metric>strong,.metric-value{font-size:20pt}
  .findings{margin-top:20pt}
  .finding-row,.findings>.finding{padding:10pt 0;grid-template-columns:34pt minmax(0,1fr)}
  .finding-row>.item-number,.finding-row>.finding-num,.findings>.finding>.item-number{font-size:18pt}
  .finding-row p,.findings>.finding p{font-size:10pt}
  /* Network page */
  .network-section{break-before:page;page-break-before:always}
  .network-panel,.network-panel.expanded{position:static;inset:auto;display:block;border:.5pt solid var(--line-strong);border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .network-legend{font-size:7.5pt;padding:6pt 8pt}
  .network-viewport{height:130mm!important;min-height:0;background:#FFFFFF;background-image:none}
  .network-viewport.is-active{box-shadow:none}
  .net-node .node-label.is-hidden,.edge-label{opacity:1!important}
  .network-path{max-height:none!important;overflow:visible;padding:8pt 10pt;font-size:8.5pt}
  .network-footer{padding:6pt 10pt;font-size:7.5pt}
  /* Blocks & tables */
  .block-grid{display:block}
  .content-block{margin-bottom:10pt;padding:12pt;break-inside:avoid-page}
  .content-block p,.question-body>.text,.profile-section p,.timeline-item p{font-size:10pt}
  .table-scroll{max-height:none;overflow:visible;border:.5pt solid var(--line-strong);border-radius:0}
  .table-scroll table,.cooccur-table{font-size:8.5pt}
  .table-scroll th,.cooccur-table th{position:static;padding:5pt 7pt}
  .table-scroll td,.cooccur-table td{padding:5pt 7pt}
  thead{display:table-header-group}
  tr{break-inside:avoid;page-break-inside:avoid}
  .table-scroll tbody tr:nth-child(even),.cooccur-table tbody tr:nth-child(even){background:#FAF8F5}
  .image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .evidence-image img{max-height:70mm;cursor:default}
  .evidence-image figcaption{font-size:8pt}
  /* Details always expanded by report.js on beforeprint */
  .question,.archive{margin-bottom:8pt;overflow:visible;break-inside:auto}
  .question summary{padding:10pt 12pt;font-size:11.5pt}
  .question-body,.archive-body{padding:10pt 12pt}
  .archive>summary{padding:10pt 12pt}
  .question summary::after,.archive>summary::after,.entity-record>summary::after{display:none}
  .entity-record .record-body{display:block!important}
  .field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field-grid dd,.facts li{font-size:9pt}
  /* Citations */
  .source-ref{min-height:0;padding:0;border:0;background:none;color:var(--text-2);font-size:7.5pt;line-height:1.4}
  .source-ref::before{content:"["}
  .source-ref::after{content:"]"}
  .source-kind-glyph{display:none}
  .entity-link{min-height:0;padding:1pt 5pt;font-size:8pt}
  .grade-badge{min-height:0;font-size:7.5pt;line-height:1.5;padding:0 5pt}
  .source-card{padding:8pt 0}
  .source-card[hidden]{display:block!important}
  .source-heading h3{font-size:10pt}
  .source-meta,.source-url{font-size:8pt}
  .source-excerpt{font-size:8.5pt}
  .source-snapshots .snapshot{display:none}
  .timeline-item{padding-bottom:12pt}
  /* Print-only appendices */
  .print-only,.print-evidence{display:block;max-width:none;break-before:page;page-break-before:always}
  .print-relations:has(#printRelationsContent:empty),.print-evidence:has(#printEvidenceContent:empty){display:none}
  .print-relations h2,.print-evidence h2{margin-bottom:10pt;font:700 18pt/1.3 var(--font-head)}
  .print-relations table,.print-evidence table{width:100%;border-collapse:collapse;font-size:8.5pt;font-variant-numeric:tabular-nums}
  .print-relations th,.print-relations td{padding:4pt 6pt;border-bottom:.5pt solid var(--line);text-align:left;vertical-align:top}
  .print-relations th{background:var(--surface-2);font-weight:700}
  .print-relations h3,.print-evidence h3{margin:12pt 0 6pt;font-size:11pt}
  .print-grade-group+.print-grade-group{margin-top:14pt}
  .print-relations-table small{color:var(--muted)}
  .print-evidence .claim-record{padding:8pt 0 8pt 10pt;break-inside:avoid}
  .print-evidence .snapshot{display:none}
  /* Avoid awkward splits */
  .finding-row,.business-metric,.evidence-image,.career-item,.edge-record,.source-card,.timeline-item,.claim-record,.path-card,.identity-card{break-inside:avoid;page-break-inside:avoid}
  .report-footer{border:0;padding:12pt 0 0;font-size:8pt}
}
</style>
</head>
<body>
  <a class="skip" href="#overview">跳到正文</a>

  <aside class="sidebar" id="sidebar" aria-label="报告目录与概况">
    <a class="brand" href="#overview"><span class="brand-seal" aria-hidden="true">档</span><span class="brand-text" id="brandTitle">背景调查<small>人物 · 资本 · 业务</small></span></a>
    <div class="nav-caption">阅读目录</div>
    <nav id="reportNav" class="report-nav" aria-label="报告目录"></nav>
    <div class="nav-footer"><span class="live-dot" aria-hidden="true"></span><span id="sidebarDate"></span><small id="sidebarCounts"></small></div>
  </aside>

  <main id="main">
    <header class="topbar" id="topbar">
      <div class="reading-progress" aria-hidden="true"><div class="reading-progress-fill" id="readingProgress"></div></div>
      <button class="icon-btn menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="sidebar"><span aria-hidden="true">☰</span><span class="menu-label">目录</span></button>
      <a class="mobile-title" href="#overview" id="mobileTitle">背景调查</a>
      <span class="topbar-kind" id="topbarKind">背景调查</span>
      <div class="topbar-actions">
        <div class="palette-switch" id="paletteSwitch" role="group" aria-label="配色方案">
          <button type="button" data-palette-choice="ink" aria-pressed="true" title="墨与印"><i class="swatch swatch-ink" aria-hidden="true"></i><span class="sr-only">墨与印</span></button>
          <button type="button" data-palette-choice="slate" aria-pressed="false" title="情报蓝"><i class="swatch swatch-slate" aria-hidden="true"></i><span class="sr-only">情报蓝</span></button>
          <button type="button" data-palette-choice="celadon" aria-pressed="false" title="青瓷"><i class="swatch swatch-celadon" aria-hidden="true"></i><span class="sr-only">青瓷</span></button>
        </div>
        <button type="button" class="quiet theme-toggle" id="themeToggle" aria-pressed="false" aria-label="切换深色或浅色模式" title="深色 / 浅色"><span aria-hidden="true">◐</span></button>
        <button type="button" class="quiet" id="openSearch" aria-haspopup="dialog" aria-controls="searchDialog"><span>搜索</span><kbd>/</kbd></button>
        <button type="button" class="quiet" id="printReport"><span>打印</span><span class="hide-sm"> / PDF</span></button>
      </div>
    </header>

    <section class="section hero" id="overview" aria-labelledby="reportTitle">
      <div class="masthead">
        <div class="eyebrow hero-eyebrow"><span id="reportEyebrow">画像与关键判断</span><span class="eyebrow-meta" id="reportDate"></span></div>
        <h1 id="reportTitle"></h1>
        <p class="hero-subtitle" id="reportSubtitle"></p>
        <div class="hero-actions" id="heroActions"><a class="btn primary" href="#network">打开关系网络 <span aria-hidden="true">↓</span></a><a class="btn secondary" href="#questions">核心问题 <span aria-hidden="true">↓</span></a></div>
      </div>
      <div class="hero-grid">
        <article class="judgment" id="judgment" aria-label="核心判断"></article>
        <div class="hero-media" id="heroMedia"></div>
      </div>
      <div class="business-metrics" id="businessMetrics" aria-label="关键数字"></div>
      <div class="findings" id="findings" aria-label="关键发现"></div>
    </section>

    <section class="section network-section" id="network" aria-labelledby="networkTitle">
      <div class="section-head"><div><span class="eyebrow" id="networkKicker">人物、公司与产品</span><h2 id="networkTitle">关系网络</h2></div><p id="networkSummary"></p></div>
      <div class="network-panel" id="networkPanel">
        <div class="network-toolbar" id="networkToolbar">
          <div class="toolbar-row toolbar-main">
            <div class="seg" role="group" aria-label="网络视图"><button type="button" data-view="core" aria-pressed="true">核心</button><button type="button" data-view="all" aria-pressed="false">全部</button><button type="button" data-view="near" aria-pressed="false">周边</button></div>
            <div class="seg" role="group" aria-label="布局方式"><button type="button" data-layout="radial" aria-pressed="true">放射</button><button type="button" data-layout="hierarchy" aria-pressed="false">层级·穿透</button><button type="button" data-layout="force" aria-pressed="false">力导</button></div>
            <div class="network-search"><label for="networkSearch" class="sr-only">搜索主体、别名与工作</label><input id="networkSearch" type="search" placeholder="搜索主体、别名与工作" autocomplete="off" aria-controls="networkResults"><div id="networkResults" class="search-results" hidden></div></div>
            <div class="tool-actions">
              <button type="button" class="tool-btn" id="togglePathfinder" aria-pressed="false" aria-controls="pathfinderBar" title="寻路 (P)"><span aria-hidden="true">⇢</span> 寻路</button>
              <button type="button" class="tool-btn" id="toggleListView" aria-pressed="false" aria-controls="networkListView" title="列表视图 (L)"><span aria-hidden="true">≣</span> 列表</button>
              <button type="button" class="tool-btn" id="networkFull" aria-pressed="false" title="全屏 (F)"><span aria-hidden="true">⤢</span> 全屏</button>
            </div>
          </div>
          <div class="toolbar-row toolbar-filters">
            <div class="chip-group" id="networkTypeFilters" role="group" aria-label="按主体类型筛选"></div>
            <span class="tool-sep" aria-hidden="true"></span>
            <div class="chip-group" id="networkRelFilters" role="group" aria-label="按关系类型筛选"></div>
            <button type="button" class="chip chip-toggle" id="toggleHistorical" aria-pressed="true"><i class="shape-icon is-clock" aria-hidden="true"></i>历史关系</button>
          </div>
        </div>
        <div class="filter-banner" id="filterBanner" role="status" hidden></div>
        <div class="pathfinder-bar" id="pathfinderBar" hidden>
          <div class="pathfinder-inputs">
            <label class="pf-field"><span>起点</span><select id="pathFrom"></select></label>
            <button type="button" class="icon-btn" id="pathSwap" aria-label="交换起点与终点" title="交换">⇄</button>
            <label class="pf-field"><span>终点</span><select id="pathTo"></select></label>
            <label class="pf-check"><input type="checkbox" id="pathConfirmedOnly" checked> 仅确认关系</label>
            <label class="pf-check"><input type="checkbox" id="pathIncludeHistory"> 含历史</label>
          </div>
          <div class="path-cards" id="pathCards" aria-live="polite"></div>
        </div>
        <div class="network-stage">
          <div class="network-legend" id="networkLegend"></div>

    if (!event.target.closest?.('#networkViewport') && G.active) setCanvasActive(false);
  });
  on('menuToggle', 'click', () => { const sidebar = $('sidebar'); if (!sidebar) return; const open = sidebar.classList.toggle('open'); $('menuToggle').setAttribute('aria-expanded', String(open)); });
  on('themeToggle', 'click', () => applyTheme(effectiveTheme() === 'dark' ? 'light' : 'dark', true));
  on('printReport', 'click', () => window.print());
  on('networkFull', 'click', () => toggleFull());
  on('zoomIn', 'click', () => zoom(.8)); on('zoomOut', 'click', () => zoom(1.25));
  on('fitGraph', 'click', () => fitGraph());
  on('resetGraph', 'click', () => { G.selected = E.has(rootId) ? rootId : coreIds[0]; G.peek = false; G.path.chosen = -1; G.typeOff.clear(); G.famOff.clear(); G.showHistorical = true; renderChips(); setView('core'); });
  on('toggleHistorical', 'click', event => { if (event.currentTarget.type === 'checkbox') return; G.showHistorical = !G.showHistorical; setOn(event.currentTarget, G.showHistorical); computeLayout(); });
  on('toggleHistorical', 'change', event => { if (event.currentTarget.type !== 'checkbox') return; G.showHistorical = event.currentTarget.checked; computeLayout(); });
  on('togglePathfinder', 'click', () => openPathfinder(!G.path.open));
  on('toggleListView', 'click', () => toggleList());
  on('pathFrom', 'change', runPathfinder); on('pathTo', 'change', runPathfinder);
  on('pathConfirmedOnly', 'change', runPathfinder); on('pathIncludeHistory', 'change', runPathfinder);
  on('pathSwap', 'click', () => { const a = $('pathFrom'), b = $('pathTo'); if (!a || !b) return; const t = a.value; a.value = b.value || a.value; b.value = t; runPathfinder(); });
  on('drawerBack', 'click', () => drawerGo(drawer.index - 1));
  on('closeDrawer', 'click', closeDrawer);
  on('drawerBackdrop', 'click', closeDrawer);
  on('drawerCopyLink', 'click', copyDrawerLink);
  on('drawerLocate', 'click', () => {
    const entry = current(); if (!entry) return;
    if (narrow()) closeDrawer();
    if (entry.kind === 'entity') selectEntity(entry.id); else if (entry.kind === 'pair') { const pair = relationMap.get(entry.id); [pair.a, pair.b].forEach(id => G.extra.add(id)); if (!G.layoutPos.has(pair.a) || !G.layoutPos.has(pair.b)) computeLayout(); selectEdge(entry.id); }
    const network = $('network'); if (network) network.scrollIntoView({behavior:reduceMotion() ? 'auto' : 'smooth', block:'start'});
  });
  on('drawerTabs', 'keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    const tabs = [...$('drawerTabs').querySelectorAll('[data-drawer-tab]')], index = tabs.indexOf(document.activeElement); if (index < 0) return;
    event.preventDefault();
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    tabs[next].click();
  });
  on('drawer', 'keydown', event => {
    if (event.key !== 'Tab' || !narrow()) return;
    const focusable = [...$('drawer').querySelectorAll('button:not([disabled]), a[href], input, select, [tabindex="0"]')].filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  document.addEventListener('keydown', event => {
    const typing = event.target.closest?.('input, textarea, select, [contenteditable="true"]');
    if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !typing) { event.preventDefault(); openGlobalSearch(); return; }
    if (event.altKey && event.key === 'ArrowLeft' && !$('drawer')?.hidden) { event.preventDefault(); drawerGo(drawer.index - 1); return; }
    if (event.key !== 'Escape') return;
    if ($('lightboxDialog')?.open || $('searchDialog')?.open) return;
    if (!$('sourcePopover')?.hidden) { hidePopover(); return; }
    if (!$('networkResults')?.hidden) { $('networkResults').hidden = true; return; }
    if ($('sidebar')?.classList.contains('open')) { $('sidebar').classList.remove('open'); $('menuToggle')?.setAttribute('aria-expanded', 'false'); return; }
    if (!$('drawer')?.hidden) { event.preventDefault(); closeDrawer(); return; }
    if (G.active) { setCanvasActive(false); return; }
    if (G.expanded) toggleFull(false);
  });
  window.addEventListener('hashchange', () => { if (!readHash() && location.hash && !/^#\//.test(location.hash)) { try { const target = $(decodeURIComponent(location.hash.slice(1))); let node = target; while (node) { if (node.tagName === 'DETAILS') node.open = true; node = node.parentElement; } } catch (_) {} } });
  window.addEventListener('scroll', () => hidePopover(), {passive:true});

  // ───────────── Graph pointer, wheel and keyboard interaction ─────────────
  const svg = $('networkSvg'), viewport = $('networkViewport');
  function nearestNode(fromId, key) {
    const from = posOf(fromId); if (!from) return null;
    const dir = {ArrowRight:[1, 0], ArrowLeft:[-1, 0], ArrowDown:[0, 1], ArrowUp:[0, -1]}[key];
    let best = null, bestScore = Infinity;
    for (const n of G.visible) {
      if (n.id === fromId) continue;
      const dx = n.x - from.x, dy = n.y - from.y, d = Math.hypot(dx, dy) || 1, cos = (dx * dir[0] + dy * dir[1]) / d;
      if (cos < .5) continue;
      const score = d * (2 - cos); if (score < bestScore) { bestScore = score; best = n.id; }
    }
    return best;
  }
  if (svg) {
    svg.addEventListener('keydown', event => {
      const node = event.target.closest('[data-node]'), edge = event.target.closest('[data-edge]');
      if (['Enter', ' '].includes(event.key) && (node || edge)) {
        event.preventDefault();
        if (node && event.shiftKey) openDrawer({kind:'entity', id:node.dataset.node});
        else if (node) selectEntity(node.dataset.node); else selectEdge(edge.dataset.edge);
        return;
      }
      if (node && ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(event.key)) { event.preventDefault(); const next = nearestNode(node.dataset.node, event.key); if (next) G.nodeEls.get(next)?.focus(); }
    });
    svg.addEventListener('dblclick', event => {
      const node = event.target.closest('[data-node]'), edge = event.target.closest('[data-edge]');
      if (node) openDrawer({kind:'entity', id:node.dataset.node});
      else if (edge) openDrawer({kind:'pair', id:edge.dataset.edge});
      else zoom(.7, event.clientX, event.clientY);
    });
    svg.addEventListener('pointerover', event => {
      const node = event.target.closest('[data-node]'); if (node) node.querySelector('.node-label')?.classList.remove('is-hidden');
      const edge = event.target.closest('[data-edge]'); if (edge) (G.labelEls.get(edge.dataset.edge) || []).forEach(l => l.classList.add('is-visible'));
    });
    svg.addEventListener('pointerout', event => {
      const node = event.target.closest('[data-node]'); if (node && !node.contains(event.relatedTarget)) applyLOD();
      const edge = event.target.closest('[data-edge]'); if (edge && !edge.contains(event.relatedTarget)) { const active = edge.classList.contains('active') || edge.classList.contains('path-active'); (G.labelEls.get(edge.dataset.edge) || []).forEach(l => l.classList.toggle('is-visible', active)); }
    });
    svg.addEventListener('pointerdown', event => {
      setCanvasActive(true);
      G.touches.set(event.pointerId, {x:event.clientX, y:event.clientY});
      if (G.touches.size === 2) { const [p, q] = [...G.touches.values()]; G.pinch = {d:Math.hypot(p.x - q.x, p.y - q.y) || 1}; G.pointer = null; return; }
      if (event.button !== 0 || G.pointer) return;
      G.pointer = {id:event.pointerId, startX:event.clientX, startY:event.clientY, x:event.clientX, y:event.clientY, node:event.target.closest('[data-node]')?.dataset.node, edge:event.target.closest('[data-edge]')?.dataset.edge, shift:event.shiftKey, moved:false};
      try { svg.setPointerCapture(event.pointerId); } catch (_) {}
    });
    svg.addEventListener('pointermove', event => {
      if (G.touches.has(event.pointerId)) G.touches.set(event.pointerId, {x:event.clientX, y:event.clientY});
      if (G.pinch && G.touches.size === 2) {
        const [p, q] = [...G.touches.values()], d = Math.hypot(p.x - q.x, p.y - q.y) || 1;
        zoom(G.pinch.d / d, (p.x + q.x) / 2, (p.y + q.y) / 2); G.pinch.d = d; return;
      }
      const ptr = G.pointer; if (!ptr || ptr.id !== event.pointerId) return;
      const rect = svg.getBoundingClientRect(), dx = (event.clientX - ptr.x) / Math.max(1, rect.width) * G.box.w, dy = (event.clientY - ptr.y) / Math.max(1, rect.height) * G.box.h;
      ptr.moved ||= Math.hypot(event.clientX - ptr.startX, event.clientY - ptr.startY) > 4;
      ptr.x = event.clientX; ptr.y = event.clientY;
      if (!ptr.moved) return;
      if (ptr.node) { const node = posOf(ptr.node); if (node) { node.x += dx; node.y += dy; updatePositions(); } }
      else { G.box.x -= dx; G.box.y -= dy; setBox(); }
    });
    const release = event => {
      G.touches.delete(event.pointerId); if (G.touches.size < 2) G.pinch = null;
      const ptr = G.pointer; if (!ptr || ptr.id !== event.pointerId) return;
      G.pointer = null;
      try { if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId); } catch (_) {}
      if (event.type !== 'pointerup' || ptr.moved) { if (ptr.moved && ptr.node) applyLOD(); return; }
      if (ptr.node && ptr.shift) openPathfinder(true, ptr.node);
      else if (ptr.node) selectEntity(ptr.node);
      else if (ptr.edge) selectEdge(ptr.edge);
    };
    svg.addEventListener('pointerup', release); svg.addEventListener('pointercancel', release);
    svg.addEventListener('lostpointercapture', event => { if (G.pointer && G.pointer.id === event.pointerId) G.pointer = null; });
  }
  if (viewport) {
    viewport.addEventListener('wheel', event => {
      if (event.ctrlKey || G.active || G.expanded) { event.preventDefault(); zoom(event.deltaY > 0 ? 1.12 : .89, event.clientX, event.clientY); return; }
      showToast('点击图谱后可用滚轮缩放 · Ctrl + 滚轮随时缩放');
    }, {passive:false});
    viewport.addEventListener('keydown', event => {
      if (event.target.closest('input, select, textarea')) return;
      const k = event.key;
      if (k === '+' || k === '=') { event.preventDefault(); zoom(.8); }
      else if (k === '-' || k === '_') { event.preventDefault(); zoom(1.25); }
      else if (k === '0') { event.preventDefault(); fitGraph(); }
    });
  }
  on('networkPanel', 'keydown', event => {
    if (event.target.closest('input, select, textarea') || event.ctrlKey || event.metaKey || event.altKey) return;
    const k = event.key.toLowerCase();
    if (k === 'f') { event.preventDefault(); toggleFull(); }
    else if (k === 'p') { event.preventDefault(); openPathfinder(!G.path.open); }
    else if (k === 'l') { event.preventDefault(); toggleList(); }
  });
  on('networkMinimap', 'click', event => {
    const mini = $('networkMinimap'), bounds = JSON.parse(mini.dataset.bounds || 'null'); if (!bounds) return;
    const rect = mini.getBoundingClientRect(), scale = Math.max(bounds[2] / Math.max(1, rect.width), bounds[3] / Math.max(1, rect.height));
    const cx = bounds[0] + bounds[2] / 2 + (event.clientX - rect.left - rect.width / 2) * scale, cy = bounds[1] + bounds[3] / 2 + (event.clientY - rect.top - rect.height / 2) * scale;
    G.box.x = cx - G.box.w / 2; G.box.y = cy - G.box.h / 2; setBox();
  });
  let resizeFrame = 0;
  if ('ResizeObserver' in window && viewport) new ResizeObserver(() => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(() => { if (!G.printing) fitGraph(); }); }).observe(viewport);

  // ───────────── Scrollspy & reading progress ─────────────
  if ('IntersectionObserver' in window) {
    const observed = new Map();
    const navObserver = new IntersectionObserver(entries => {
      for (const entry of entries) observed.set(entry.target.id, entry.isIntersecting);
      const active = navItems.find(item => observed.get(item.id));
      if (active) document.querySelectorAll('[data-nav]').forEach(link => { const on = link.dataset.nav === active.id; link.classList.toggle('active', on); if (on) link.setAttribute('aria-current', 'location'); else link.removeAttribute('aria-current'); });
    }, {rootMargin:'-10% 0px -60% 0px'});
    navItems.forEach(item => { const el = $(item.id); if (el) navObserver.observe(el); });
  }
  let progressFrame = 0;
  function updateProgress() {
    const el = $('readingProgress'); if (!el) return;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight), p = clamp(window.scrollY / max, 0, 1);
    el.style.width = `${(p * 100).toFixed(2)}%`; el.style.setProperty('--progress', p.toFixed(4));
    el.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    if (el.tagName === 'PROGRESS') { el.max = 1; el.value = p; }
  }
  window.addEventListener('scroll', () => { cancelAnimationFrame(progressFrame); progressFrame = requestAnimationFrame(updateProgress); }, {passive:true});

  // ───────────── Print (A4) ─────────────
  function printRelationsHtml() {
    const rows = validRelationships.slice().sort((a, b) => FAMILY_ORDER.indexOf(family(a)) - FAMILY_ORDER.indexOf(family(b)) || String(name(a.from)).localeCompare(String(name(b.from)), 'zh-CN'));
    if (!rows.length) return '';
    return `<div class="table-scroll"><table class="fact-table print-relations-table"><thead><tr><th scope="col">起点</th><th scope="col">关系</th><th scope="col">终点</th><th scope="col" class="num-cell">比例 / 金额</th><th scope="col" class="num-cell">日期 / 期间</th><th scope="col">状态</th><th scope="col">来源</th></tr></thead><tbody>${rows.map(e => `<tr class="fam-${family(e)}"><td>${esc(name(e.from))}</td><td>${esc(e.label || relLabel(e))}<small> · ${esc(FAMILY[family(e)])}</small></td><td>${esc(name(e.to))}</td><td class="num-cell">${esc([e.percent != null ? fmtPct(e.percent) : '', e.amount != null ? [valueText(e.amount), e.currency, e.unit].filter(Boolean).join(' ') : ''].filter(Boolean).join(' · ') || '—')}</td><td class="num-cell">${esc(e.date || [e.valid_from, e.valid_to].filter(Boolean).join(' — ') || '—')}</td><td>${esc(statuses[edgeStatus(e)] || (isSignal(e) ? '关联信号' : '现行'))}</td><td>${esc(arr(e.sources).map(id => `[${id}]`).join(' '))}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function printEvidenceHtml() {
    const order = [...Object.keys(GRADES), ...uniq([...C.values()].map(c => c.kind)).filter(k => !GRADES[k])];
    return order.map(kind => {
      const list = [...C.values()].filter(c => c.kind === kind); if (!list.length) return '';
      return `<section class="print-grade-group"><h3>${gradeBadge(kind)} · ${list.length}</h3>${list.map(claimHtml).join('')}</section>`;
    }).join('');
  }
  let printState = null;
  window.addEventListener('beforeprint', () => {
    if (printState) return;
    hidePopover();
    printState = {details:[...document.querySelectorAll('details')].map(el => [el, el.open]), box:{...G.box}, fitWidth:G.fitWidth, list:G.list, viewportHidden:$('networkViewport')?.hidden};
    G.printing = true;
    setHidden('networkViewport', false);
    setHtml('printRelationsContent', printRelationsHtml());
    setHtml('printEvidenceContent', printEvidenceHtml());
    document.querySelectorAll('[data-entity-record]').forEach(materialize);
    document.querySelectorAll('img').forEach(image => { image.loading = 'eager'; });
    printState.details.forEach(([el]) => { el.open = true; });
    document.querySelectorAll('.source-card[hidden]').forEach(card => { card.dataset.printHidden = '1'; card.hidden = false; });
    fitGraph(null, 180 / 130);
    applyLOD();
  });
  window.addEventListener('afterprint', () => {
    if (!printState) return;
    printState.details.forEach(([el, open]) => { el.open = open; });
    document.querySelectorAll('.source-card[data-print-hidden]').forEach(card => { card.hidden = true; delete card.dataset.printHidden; });
    G.printing = false; G.box = printState.box; G.fitWidth = printState.fitWidth;
    setHidden('networkViewport', Boolean(printState.viewportHidden));
    printState = null;
    setHtml('printRelationsContent', ''); setHtml('printEvidenceContent', '');
    setBox(); applyLOD(); requestAnimationFrame(() => fitGraph());
  });

  // ───────────── Initialise ─────────────
  G.layout = chooseInitialLayout();
  document.querySelectorAll('[data-layout]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layout === G.layout)));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === G.view)));
  renderChips(); renderLegend(); populatePathSelects();
  setHidden('pathfinderBar', true); setOn($('togglePathfinder'), false);
  setHidden('networkListView', true); setOn($('toggleListView'), false);
  setOn($('networkFull'), false); setHidden('networkMinimap', true); setHidden('canvasToast', true); setHidden('networkPeek', true);
  if (G.visible.length === 0) computeLayout({instant:true});
  renderPeek(); updateProgress();
  if (!readHash() && location.hash && !/^#\//.test(location.hash)) {
    try { const target = $(decodeURIComponent(location.hash.slice(1))); let node = target; while (node) { if (node.tagName === 'DETAILS') node.open = true; node = node.parentElement; } } catch (_) {}
  }
})();
</script>
